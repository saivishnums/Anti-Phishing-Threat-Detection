<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Threat Detection Suite{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full font-sans antialiased text-slate-100 flex flex-col">
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md px-6 py-4 flex items-center justify-between font-mono">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
            <a href="/dashboard" class="text-sm font-bold tracking-wider text-cyan-400 hover:underline">Threat Detection Suite</a>
        </div>
        {% if username %}
        <nav class="flex items-center gap-5 text-xs">
            <a href="/dashboard" class="hover:text-cyan-400 transition-colors">Dashboard</a>
            <a href="/scanner" class="hover:text-cyan-400 transition-colors">URL Scanner</a>
            <a href="/document-scanner" class="hover:text-cyan-400 transition-colors">Document Analyzer</a>
            <a href="/sms-scanner" class="hover:text-cyan-400 transition-colors">SMS Smishing</a>
            <a href="/analyst-profile" class="hover:text-cyan-400 transition-colors">Analyst Profile</a>
            <a href="/threat-reports" class="hover:text-cyan-400 transition-colors">Threat Reports</a>
            <a href="/logout" class="text-rose-400 hover:text-rose-300 transition-colors">Logout</a>
        </nav>
        {% endif %}
    </header>
    <main class="flex-1 max-w-5xl w-full mx-auto p-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
